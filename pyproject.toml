[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-cairn"
dynamic = ["version"]
description = "Hand off agent work between sessions, accounts and agents without re-explaining."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "sondc" }]
keywords = ["claude-code", "ai-agents", "handoff", "context", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/sdc-ren/cairn"
Issues = "https://github.com/sdc-ren/cairn/issues"

[project.scripts]
cairn = "agent_cairn.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[tool.setuptools.dynamic]
version = { attr = "agent_cairn.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_cairn = ["assets/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["req(id): requirement criterion (Rn.m) this test verifies"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "SIM", "C4", "C90", "PL", "RUF",
          "T20", "PTH", "ERA", "RET", "ARG", "FBT", "BLE", "S", "TRY"]
ignore = ["D203", "D213", "TRY003"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-statements = 40

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"src/agent_cairn/proc.py" = ["S603", "S607"]      # the only place that runs processes
"src/agent_cairn/out.py" = ["T201"]               # the only place that prints
"src/agent_cairn/cli.py" = ["BLE001"]
"src/agent_cairn/hook.py" = ["BLE001"]
"tests/**" = ["D", "S101", "S603", "S607", "PLR2004", "ARG001"]
