name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          # newer Ubuntu images ship no Python 3.9 build; 3.9 is the minimum we support
          - os: ubuntu-22.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: make lint BIN="$(dirname "$(which python)")"
      - name: Test with coverage
        run: pytest -q --cov
      - name: Every automated requirement has a test
        run: python scripts/req_coverage.py --level M1 --automated-only
      - name: Generated plugin files are up to date
        run: python scripts/gen_plugin.py --check
      - name: Package builds and installs with pip, pipx and uv
        env:
          # the runner's shared /opt/pipx was built for another Python; use a private one
          PIPX_HOME: ${{ runner.temp }}/pipx
          PIPX_BIN_DIR: ${{ runner.temp }}/pipx-bin
        run: |
          python -m pip install build pipx uv
          python -m build
          python -m pip install dist/*.whl --force-reinstall
          cairn version
          python -m pipx install dist/*.whl
          "$(python -m pipx environment --value PIPX_BIN_DIR)/cairn" version
          uv tool install dist/*.whl --force
          "$(uv tool dir --bin)/cairn" version
      - name: npm package runs with npx
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP" && npx --yes --package ./agent-cairn-*.tgz cairn version
