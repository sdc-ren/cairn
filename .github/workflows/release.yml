name: Release

# Push a tag such as v0.2.0 to build, publish to PyPI and create the GitHub release.
# PyPI publishing uses Trusted Publishing: on pypi.org, add this repository and the workflow
# "release.yml" (environment "pypi") as a trusted publisher of agent-cairn. No token is stored.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Version matches the tag
        run: |
          version=$(python -c "import sys; sys.path.insert(0, 'src'); import agent_cairn; print(agent_cairn.__version__)")
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Build
        run: |
          python -m pip install build
          python -m build
          python -m pip install dist/*.whl
          cairn version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
