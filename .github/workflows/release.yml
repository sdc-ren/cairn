name: Release

# Push a tag such as v0.2.0 to build, create the GitHub release and (optionally) publish to PyPI.
# PyPI uses Trusted Publishing: on pypi.org add this repository, the workflow "release.yml" and
# the environment "pypi" as a trusted publisher of agent-cairn, then set the repository
# variable PUBLISH_PYPI=true. No token is stored.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Version matches the tag
        run: |
          version=$(python -c "import sys; sys.path.insert(0, 'src'); import agent_cairn; print(agent_cairn.__version__)")
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Build
        run: |
          python -m pip install build
          python -m build
          python -m pip install dist/*.whl
          cairn version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          # the CHANGELOG section of this version is the release text
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## /{on=0} on' CHANGELOG.md > notes.md
          test -s notes.md
          # re-running the workflow (e.g. to publish to PyPI later) keeps the existing release
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" dist/* --title "cairn $GITHUB_REF_NAME" --notes-file notes.md
